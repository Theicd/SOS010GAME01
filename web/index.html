<!doctype html>
<html lang="en-us">
  <head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name=viewport content="width=device-width, initial-scale=1">
	<meta content="Nazi Zombies: Portable" property="og:title" />
    	<meta content="Call of Duty: Zombies de-make, now in your browser via WebGL!" property="og:description" />
    	<meta content="https://nzp-team.github.io/latest/game.html" property="og:url" />
   	<meta content="hhttps://nzp-team.github.io/latest/nzportable.ico" property="og:image" />
	<meta content="#6e0d00" data-react-helmet="true" name="theme-color" />
	<title>NZ: Portable</title>
	<link rel="icon" href="nzportable.ico">
	<style>
	html,body { background-color:#030a14; color:#c5d0dc; height:100%;width:100%;margin:0;padding:0;overflow:hidden;}
	.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
	div.emscripten { text-align: center; padding:0; margin: 0;}
	canvas.emscripten { border: 0px none; width:100%; height:100%; padding:0; margin: 0; touch-action:none; outline:none;}
	#status, #progress { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
	#sosLoad {
		position:fixed; inset:0; z-index:40;
		background:#030a14;
		display:flex; align-items:flex-end; justify-content:center;
	}
	#sosLoadBlur {
		position:absolute; inset:-40px;
		background:#030a14 url('nzp-cover.png') center / cover no-repeat;
		filter:blur(36px) saturate(1.3) brightness(.42);
		transform:scale(1.12);
	}
	#sosLoadArt {
		position:absolute; inset:0;
		width:100%; height:100%;
		object-fit:contain;
		object-position:center center;
		pointer-events:none;
		z-index:1;
	}
	#sosLoad[hidden] { display:none !important; }
	#sosLoad::before {
		content:''; position:absolute; inset:0; z-index:1;
		background:linear-gradient(180deg, rgba(3,10,20,.2) 0%, rgba(3,10,20,.28) 48%, rgba(3,10,20,.88) 100%);
		pointer-events:none;
	}
	#sosLoadUi { position:relative; width:min(520px, 88vw); padding:0 0 12vh; text-align:center; z-index:2; }
	#sosLoadTitle { color:#d7e4f0; font:700 13px "Segoe UI",system-ui; letter-spacing:.12em; margin-bottom:8px; }
	#sosLoadName { color:#f4f7fb; font:700 28px/1.1 "Segoe UI",system-ui; margin:0 0 18px; }
	#sosLoadBar {
		height:10px; border-radius:999px; overflow:hidden;
		background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
	}
	#sosLoadFill {
		display:block; height:100%; width:8%;
		background:#2d88ff;
		transition:width .25s ease;
	}
	#sosLoadText { margin-top:12px; color:#c5d0dc; font:600 14px "Segoe UI",system-ui; }
	#nzpTouchHud { display:none; }
	@media (pointer: coarse) {
		body.nzp-ready #nzpTouchHud { display:block; }
	}
	.nzp-joy {
		position:fixed; left:14px; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); z-index:30;
		width:128px; height:128px; touch-action:none;
	}
	.nzp-joy__base {
		position:relative;
		width:128px; height:128px; border-radius:50%;
		background:rgba(255,255,255,.06);
		border:2px solid rgba(255,255,255,.28);
		box-shadow:inset 0 0 18px rgba(0,0,0,.35);
	}
	.nzp-joy__stick {
		position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px;
		border-radius:50%;
		background:rgba(255,255,255,.18);
		border:2px solid rgba(255,255,255,.55);
		box-shadow:0 0 10px rgba(0,175,255,.25);
		pointer-events:none;
	}
	.nzp-act {
		position:fixed; z-index:31; border:0; color:rgba(255,255,255,.92);
		font:700 10px system-ui; letter-spacing:.02em;
		touch-action:none; -webkit-user-select:none; user-select:none;
		display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
		background:rgba(8,16,28,.28);
		border:1.5px solid rgba(255,255,255,.32);
		box-shadow:inset 0 0 12px rgba(255,255,255,.08);
	}
	.nzp-act svg { width:22px; height:22px; fill:currentColor; }
	.nzp-act--fire {
		right:14px; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); width:78px; height:78px; border-radius:50%;
		color:#ffd0d6; border-color:rgba(255,80,100,.55); background:rgba(255,48,79,.22);
	}
	.nzp-act--fwd {
		right:102px; bottom:calc(28px + env(safe-area-inset-bottom, 0px)); width:58px; height:58px; border-radius:50%;
		color:#d6f3ff; border-color:rgba(0,175,255,.4);
	}
	.nzp-act--jump {
		right:16px; bottom:calc(112px + env(safe-area-inset-bottom, 0px)); width:54px; height:54px; border-radius:50%;
		color:#e8f7ff;
	}
	.nzp-act--use {
		right:80px; bottom:calc(112px + env(safe-area-inset-bottom, 0px)); width:54px; height:54px; border-radius:50%;
		color:#dcecff; border-color:rgba(8,104,255,.4);
	}
	</style>
  </head>
  <body ondrop="gotdrop(event);" ondragover="event.preventDefault()">
	<div id="sosLoad">
		<div id="sosLoadBlur"></div>
		<img id="sosLoadArt" src="nzp-cover.png" alt="">
		<div id="sosLoadUi">
			<div id="sosLoadTitle">SOS PLAY</div>
			<div id="sosLoadName">NZ:P</div>
			<div id="sosLoadBar"><i id="sosLoadFill"></i></div>
			<div id="sosLoadText">טוען את הזירה...</div>
		</div>
	</div>
	<div class="emscripten" id="status">Please allow/unblock our javascript to play.</div>
	<div id="dropzone" ondrop="gotdrop(event);" ondragover="event.preventDefault()" hidden=1>Drop Zone</div>
	<button type="button" onclick="begin()" id="begin" hidden=1>Click To Begin!</button>
	<div class="emscripten">
		<progress value="0" max="100" id="progress" hidden=1></progress>  
	</div>
	<canvas class="emscripten" id="canvas" tabindex="0" oncontextmenu="event.preventDefault()" hidden=1></canvas>
	<script type='text/javascript'>
// connect to canvas
var Module = {
	files:
	{
		"default.fmf" : "default.fmf",
		"nzp/game.pk3" : "nzp/game.pk3",
		"nzp/progs.pk3" : "nzp/progs.pk3",
		"nzp/autoexec.cfg" : "nzp/autoexec.cfg"
	},
	print: function(msg)
	{	//stdout...
		console.log(msg);
	},
	printErr: function(text)
	{	//stderr...
		console.log(text);
	},
	canvas: document.getElementById('canvas'),	//for webgl to attach to
	setStatus: function(text)
	{	//gets spammed some prints during startup. blame emscripten.
		if (Module.setStatus.interval)
			clearInterval(Module.setStatus.interval);
		var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
		var statusElement = document.getElementById('status');
		var progressElement = document.getElementById('progress');
		if (m) {
			text = m[1];
			progressElement.value = parseInt(m[2])*100;
			progressElement.max = parseInt(m[4])*100;
			progressElement.hidden = false;
		} else {
			progressElement.value = null;
			progressElement.max = null;
			progressElement.hidden = true;
		}
		statusElement.innerHTML = text;
		statusElement.hidden = text.length==0;
		var fill = document.getElementById('sosLoadFill');
		var loadText = document.getElementById('sosLoadText');
		var load = document.getElementById('sosLoad');
		if (fill && m) {
			var pct = Math.max(8, Math.round(100 * parseInt(m[2], 10) / Math.max(1, parseInt(m[4], 10))));
			fill.style.width = pct + '%';
		}
		if (loadText && text) loadText.textContent = text;
		if (text.length==0) {
			sosNotify('ready');
			if (load) load.hidden = true;
			document.body.classList.add('nzp-ready');
			if (!window._nzpTouchHud) {
				window._nzpTouchHud = true;
				var s = document.createElement('script');
				s.src = 'touch-hud.js?v=20260915nzp10';
				document.body.appendChild(s);
			}
		}
	},
//	preRun: [],
	totalDependencies: 0,
	monitorRunDependencies: function(left)
	{	//progress is progress...
		this.totalDependencies = Math.max(this.totalDependencies, left);
		Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
	},
//	onRuntimeInitialized: function(){},
	postRun:
	[	//each of these are called after main was run. we should have our mainloop set up now
		function()
		{
			if (Module["sched"] === undefined)
			{	//our main function failed to set up the main loop. ie: main didn't get called. panic.
				alert("Unable to initialise. You may need to restart your browser. If you get this often and inconsistently, consider using a 64bit browser instead.");
				Module.setStatus("Initialisation Failure");
			}
		}
	],
};
function sosNotify(event)
{
	try {
		var msg = { type: 'sos-nzp', event: event };
		if (window.opener) window.opener.postMessage(msg, '*');
		if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*');
	} catch (e) {}
}
function sosSafeToken(value, fallback, max)
{
	var t = String(value || '').replace(/[^\x20-\x7E]/g, '').replace(/["\\;]/g, '').trim();
	t = t.replace(/\s+/g, ' ').slice(0, max || 16);
	return t || fallback;
}
function applySosLaunch()
{
	var q = new URLSearchParams(window.location.search || '');
	var role = String(q.get('sos') || '').toLowerCase();
	var ice = String(q.get('ice') || '').replace(/[^a-z0-9]/gi, '').slice(0, 16);
	if ((role !== 'host' && role !== 'join') || !ice) return false;
	var player = sosSafeToken(q.get('name'), 'Player', 15);
	var room = sosSafeToken(q.get('room'), ice, 24);
	var id = '/' + ice;
	var args = ['+com_protocolname', 'NZP-REBOOT-WEB', '+sv_maxclients', '4', '+name', player, '+net_ice_broker', 'tls://master.frag-net.com:27950', '+exec', 'autoexec.cfg'];
	if (role === 'host') {
		args.push('+hostname', room, '+sv_port_rtc', id, '+map', 'ndu');
	} else {
		args.push('+connect', id);
	}
	Module.arguments = args;
	sosNotify(role);
	return true;
}
function begin()
{
	if (Module.began)
		return;
	Module.began = true;
	document.getElementById('dropzone').hidden = true;
	document.getElementById('begin').hidden = true;
	Module.setStatus('Downloading...');

	// make a script. do it the hard way for the error.
	var s = document.createElement('script');
	// set it up
	s.setAttribute('src',"ftewebgl.js");
	s.setAttribute('type',"text/javascript");
	s.setAttribute('charset',"utf-8");
	s.addEventListener('error', function() {alert("Oh noes! we got an error!"); Module.setStatus("Unable to download engine javascript");}, false);
	// add to DOM
	document.head.appendChild(s);
}

//stuff to facilitate our drag+drop filesystem support
function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")
		return path+fname;	//already has a path. use it. this allows people to drag+drop gamedirs.
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;	//bsps get their own extra subdir
	return "id1/" + fname;	//probably a pak. maybe a cfg, no idea really.
}
function showfiles()
{	//print the pending file list in some pretty way
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	var nt = "Drag gamedirs or individual package files here to make them available!<br/>Active Files:<br/><pre>";
	var keys = Object.keys(Module.files);
	for(var i = 0; i < keys.length; i++)
	{
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			var sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")<br/>";
		}
		else
			nt += "    " + keys[i] + "<br/>";
	}
	nt += "</pre>("+keys.length+" files)";
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{	//for directory drops
	if (item.isFile)
	{
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
    	});
	}
	else if (item.isDirectory)
	{
		// Get folder contents
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{	//user drag+dropped something. 
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
		}
	showfiles();
}
var sosLaunch = applySosLaunch();
Module.arguments = Module.arguments || [];
if (Module.arguments.indexOf('autoexec.cfg') < 0) Module.arguments.push('+exec', 'autoexec.cfg');
if (sosLaunch || window.location.hash != "" || Object.keys(Module.files).length)
	begin();		//if the url has a #foo.fmf then just begin instantly, 
else
	showfiles();	//otherwise show our lame file dropper and wait for the user to click 'go'.
    </script>  
    <img src="https://hits.sh/hits.sh/nzp-team.github.io/latest/game.html/hits.svg" style="opacity:0;width:0px;">
  </body>
